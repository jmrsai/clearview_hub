name: clearview_hub
description: "An AI-driven eye health platform for diagnosis, therapy, and prevention."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── Core UI & Navigation ───────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  go_router: ^17.2.3
  flutter_screenutil: ^5.9.3
  flex_color_scheme: ^8.0.2
  font_awesome_flutter: ^11.0.0
  flutter_animate: ^4.5.2

  # ── Charts & Calendar ─────────────────────────────────────────────────────
  fl_chart: ^1.2.0
  table_calendar: ^3.1.3
  lottie: ^3.3.3

  # ── Local Database (Encrypted for HIPAA) ──────────────────────────────────
  sqflite_sqlcipher: ^3.1.0-alpha.1
  path: ^1.9.1
  path_provider: ^2.1.5

  # ── Preferences & Secure Storage ──────────────────────────────────────────
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^10.2.0
  local_auth: ^3.0.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  alarm: ^5.2.1

  # ── Flame Game Engine ─────────────────────────────────────────────────────
  flame: ^1.16.0
  flame_audio: ^2.1.8

  # ── Camera & Imaging ──────────────────────────────────────────────────────
  camera: ^0.11.2+2
  image_picker: ^1.2.2
  image_cropper: ^12.2.1

  # ── AI & Machine Learning ─────────────────────────────────────────────────
  google_generative_ai: ^0.4.7
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_text_recognition: ^0.15.1
  flutter_vision: ^2.0.0
  eye_tracking: ^0.1.2
  face_detection_tflite: ^6.2.5
  hand_detection: ^3.0.3
  flutter_liveness: ^1.1.3
  flutter_3d_controller: ^2.3.0
  
  # ── Telemetry & IoT ───────────────────────────────────────────────────────
  health: ^13.3.1
  flutter_blue_plus: ^2.3.2
  flutter_blue_plus_winrt: ^0.0.20
  spen_remote: ^0.0.4
  carp_mobile_sensing: ^2.1.1
  carp_core: ^2.1.2
  connectivity_plus: ^7.1.1
  webview_flutter: ^4.10.0
  wakelock_plus: ^1.5.2
 
  # ── Firebase Suite ────────────────────────────────────────────────────────
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  cloud_functions: ^6.2.0
  firebase_crashlytics: ^5.2.0
  firebase_performance: ^0.11.3
  firebase_remote_config: ^6.4.0
  firebase_app_check: ^0.4.3
  firebase_database: ^12.3.0
  google_sign_in: ^7.2.0

  # ── HTTP, PDF & Utilities ─────────────────────────────────────────────────
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.2

  # ── Speech, TTS & Translation ─────────────────────────────────────────────
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  translator: ^1.0.0+1

  # ── Accessibility & UX ────────────────────────────────────────────────────
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  encrypt: ^5.0.3
  skeletonizer: ^2.1.3
  googleapis: ^16.0.0
  googleapis_auth: ^1.6.0
  flutter_zoom_videosdk: ^2.5.0
  dash_chat_2: ^0.0.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/loading.png
    - assets/models/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  linux:
    generate: true
    image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#0A0E1A"
  color_dark: "#0A0E1A"
  image: "assets/images/loading.png"
  android: true
  ios: true
  web: true
  android_12:
    image: "assets/images/loading.png"
    icon_background_color: "#0A0E1A"
