name: clearview_hub
description: "EyeVerse AI: A futuristic portable AI eye clinic and global digital eye-health operating system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Core
  # Core
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2
  go_router: ^14.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dio: ^5.4.0
  logger: ^2.0.2
  equatable: ^2.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3

  # Backend
  supabase_flutter: ^2.12.4
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

  # AI & Hardware
  camera: ^0.11.0
  image_picker: ^1.1.2
  tflite_flutter: ^0.11.0
  google_mlkit_face_detection: ^0.12.0
  sensors_plus: ^7.0.0
  battery_plus: ^7.0.0
  proximity_sensor: ^1.3.10
  light: ^5.0.0
  screen_brightness: ^1.0.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.7.0
  
  # Accessibility & Voice
  flutter_tts: ^3.8.3
  speech_to_text: ^6.6.0
  vibration: ^2.0.1
  
  # UI & Reports
  # UI & Reports
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  easy_localization: ^3.0.3
  percent_indicator: ^4.2.3
  pdf: ^3.10.8
  printing: ^5.11.1
  confetti: ^0.7.0
  infinite_scroll_pagination: ^4.0.0

  # Media & Video
  video_player: ^2.8.2
  chewie: ^1.7.1

  # Encryption
  encrypt: ^5.0.3

  # Audio
  audioplayers: ^6.0.0

  # Realtime & Messaging (Telegram Style)
  sodium_libs: ^3.1.0
  firebase_database: any
  rxdart: ^0.27.7
  record: ^5.0.0
  path: ^1.9.0


  # Notifications & Connectivity
  workmanager: ^0.9.0+3
  timezone: ^0.9.2
  firebase_messaging: any
  flutter_local_notifications: ^17.1.0
  connectivity_plus: ^6.0.3

  # Telemedicine
  flutter_webrtc: any
  jitsi_meet_wrapper: any

  # Games
  flame: ^1.16.0

  # Utilities
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  intl: any
  uuid: ^4.3.3
  share_plus: ^12.0.2
  url_launcher: ^6.2.5
  local_auth: ^2.2.0
  qr_flutter: ^4.1.0
  http: ^1.2.1
  crypto: ^3.0.3
  flutter_3d_controller: ^2.3.0
  model_viewer_plus: ^1.10.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/lottie/
    - assets/fonts/
    - assets/onboarding/
    - assets/ai_assistant/
    - assets/medical/
    - assets/therapy/
    - assets/games/
